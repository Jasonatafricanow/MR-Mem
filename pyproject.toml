[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mr-mem"
version = "0.2.0"
description = "Standalone Memory runtime extracted from Mind Runtime"
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Jasonatafricanow"}]
dependencies = []

[project.optional-dependencies]
vector = [
    "qdrant-client==1.19.0",
    "fastembed==0.8.0",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mr_mem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
