services:
  mrmem:
    build: .
    image: mr-mem:local
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      MRMEM_COMPILE_CONCURRENCY: ${MRMEM_COMPILE_CONCURRENCY:-8}
    ports:
      - "${MRMEM_BIND_ADDRESS:-127.0.0.1}:${MRMEM_HOST_PORT:-8765}:8765"
    volumes:
      - mrmem-data:/var/lib/mrmem
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  mrmem-data:
