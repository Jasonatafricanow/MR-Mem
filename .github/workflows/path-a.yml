name: path-a

on:
  push:
    branches: ["feat/aml-20261013"]
  pull_request:
  workflow_dispatch:

jobs:
  path-a-with-lce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,lce,aml]"
      - run: ruff check src tests
      - run: python -c "import lce; print('lce', lce.__file__)"
      - run: pytest -rs tests/test_lce_path_a.py tests/test_path_a_read.py tests/test_path_a_ingest.py tests/test_aml_runtime.py
      - run: pytest
      - run: python scripts/smoke_offline.py
