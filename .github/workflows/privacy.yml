name: privacy
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-pinned scanner
        shell: bash
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum -c -
          mkdir -p /tmp/mrmem-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/mrmem-gitleaks gitleaks
      - name: Scan Git history without printing secrets
        run: /tmp/mrmem-gitleaks/gitleaks git . --redact --no-banner --log-opts="--all"
